<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>스도쿠</title>
    <link rel="stylesheet" href="./css/sudoku.css" />
    <script src="./js/sudoku.js" defer></script>
  </head>
  <body>
    <div class="level-buttons">
      <button class="easy-btn">초급</button>
      <button class="medium-btn">중급</button>
      <button class="hard-btn">고급</button>
    </div>

    <div id="current-level">현재 난이도: 없음</div>

    <div id="sudoku-board"></div>

    <div class="buttons">
      <button id="reset-btn">초기화</button>
      <button id="show-answer-btn">정답 보기</button>
    </div>
  </body>
</html>
